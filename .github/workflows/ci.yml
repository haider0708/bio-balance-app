name: BioBalance checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1029:1025", "8029:8025"]
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: biobalance
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: biobalance_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd="pg_isready -U biobalance" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: node --test tests/load/operation-retry.test.mjs
      - run: python3 -m unittest discover -s tests/release -p '*_test.py'
      - run: python3 -m unittest discover -s tests/operations -p '*_test.py'
      - run: python3 -m unittest discover -s tests/catalog -p '*_test.py'
      - run: bash scripts/install-dependencies.sh
      - run: npm run db:generate
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://biobalance:local-development-only@localhost:54329/biobalance_test
      - run: psql "$OWNER_URL" -v app_password=local-app-only -f scripts/provision-role.sql
        env:
          OWNER_URL: postgresql://biobalance:local-development-only@localhost:54329/biobalance_test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run format:check && npm run build && npm test && npm run test:integration && npm run test:audit && npm run test:security && npm run test:media && npm run test:notifications && npm run test:email
        env:
          TEST_APP_DATABASE_URL: postgresql://biobalance_app:local-app-only@localhost:54329/biobalance_test
          TEST_OWNER_DATABASE_URL: postgresql://biobalance:local-development-only@localhost:54329/biobalance_test
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.5", channel: stable, cache: true }
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: npm run test:contracts
      - run: npm run test:mobile-sync
      - run: bash scripts/check-contract-drift.sh
      - uses: actions/upload-artifact@v4
        with: { name: openapi, path: contracts/openapi/biobalance.json }
  android:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.5", channel: stable, cache: true }
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: bash ../../scripts/build-mobile-release.sh compile-only android config/mobile/compile-only.json
      - uses: actions/upload-artifact@v4
        with:
          {
            name: android-debug,
            path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk,
          }
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-compilation
          path: .artifacts/releases/builds/
  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.5", channel: stable, cache: true }
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign --target lib/main.dart --dart-define-from-file=../../config/mobile/compile-only.json
  android-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: biobalance
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: biobalance_journeys_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd="pg_isready -U biobalance" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.5", channel: stable, cache: true }
      - run: bash scripts/install-dependencies.sh && npm run db:generate && npm run db:migrate
        env:
          DATABASE_URL: postgresql://biobalance:local-development-only@localhost:54329/biobalance_journeys_test
      - run: psql "$OWNER_URL" -v app_password=local-app-only -f scripts/provision-role.sql
        env:
          OWNER_URL: postgresql://biobalance:local-development-only@localhost:54329/biobalance_journeys_test
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: npm run test:journeys && npm run test:android-restart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-journey-evidence
          path: apps/mobile/build/integration_response_data.json
          if-no-files-found: ignore
