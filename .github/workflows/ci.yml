name: BioBalance checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: biobalance
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: biobalance_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd="pg_isready -U biobalance" --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://biobalance:local-development-only@localhost:54329/biobalance_test
      - run: psql "$OWNER_URL" -v app_password=local-app-only -f scripts/provision-role.sql
        env:
          OWNER_URL: postgresql://biobalance:local-development-only@localhost:54329/biobalance_test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run build && npm test && npm run test:integration && npm run test:media
        env:
          TEST_APP_DATABASE_URL: postgresql://biobalance_app:local-app-only@localhost:54329/biobalance_test
          TEST_OWNER_DATABASE_URL: postgresql://biobalance:local-development-only@localhost:54329/biobalance_test
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.5", channel: stable, cache: true }
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: npm run test:mobile-sync
      - run: npm run api:contract && python3 scripts/generate-dart-client.py
      - uses: actions/upload-artifact@v4
        with: { name: openapi, path: contracts/openapi/biobalance.json }
  android:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.5", channel: stable, cache: true }
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          {
            name: android-debug,
            path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk,
          }
  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.5", channel: stable, cache: true }
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign
