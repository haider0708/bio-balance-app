name: biobalance
x-api-environment: &api-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?Set the restricted application connection}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set a 32-byte MFA encryption key}
  MEDIA_ROOT: /var/lib/biobalance/media
x-app: &app
  image: ${API_IMAGE:?Set an immutable API image tag or digest}
  restart: unless-stopped
  networks: [private]
  read_only: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  tmpfs: [/tmp:size=128m]
  volumes: [media:/var/lib/biobalance/media]
  environment: *api-env
  stop_grace_period: 30s
  depends_on:
    postgres: {condition: service_healthy}
  logging: {driver: json-file, options: {max-size: 10m, max-file: '5'}}
services:
  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports: ['80:80','443:443']
    networks: [private]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certificates:/etc/nginx/certificates:ro
      - ./acme:/var/www/acme:ro
    depends_on:
      api1: {condition: service_healthy}
      api2: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/nginx-health']
      interval: 20s
      timeout: 3s
      retries: 3
    logging: {driver: json-file, options: {max-size: 10m, max-file: '5'}}
  api1:
    <<: *app
    mem_limit: 768m
    cpus: 1.5
  api2:
    <<: *app
    mem_limit: 768m
    cpus: 1.5
  worker:
    <<: *app
    volumes: []
    command: [node,dist/worker.js]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:?Set sender}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');process.exit(Date.now()-Number(fs.readFileSync('/tmp/biobalance-worker-heartbeat','utf8'))<60000?0:1)"]
      interval: 30s
      start_period: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    mem_limit: 384m
    cpus: 0.5
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set owner name}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set owner password}
      POSTGRES_DB: ${POSTGRES_DB:?Set database name}
    networks: [private]
    volumes: [database:/var/lib/postgresql/data]
    shm_size: 512m
    mem_limit: 5g
    cpus: 2
    command: [postgres,-c,shared_buffers=1GB,-c,work_mem=8MB,-c,max_connections=100,-c,log_min_duration_statement=500]
    healthcheck:
      test: [CMD-SHELL,'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: {driver: json-file, options: {max-size: 10m, max-file: '5'}}
  # One-off commands: `compose run --rm migrate` applies migrations, `compose run --rm bootstrap-admin` creates the first admin.
  migrate:
    <<: *app
    profiles: [maintenance]
    restart: 'no'
    command: [../../node_modules/.bin/prisma,migrate,deploy]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set migration owner connection}
    healthcheck: {disable: true}
    volumes: []
  bootstrap-admin:
    <<: *app
    profiles: [maintenance]
    restart: 'no'
    command: [node,dist/bootstrap-admin.js]
    environment:
      <<: *api-env
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SETUP_FILE: /setup/admin-setup.json
    healthcheck: {disable: true}
    volumes: [./setup:/setup]
networks:
  private:
    driver: bridge
volumes:
  database:
  media:
