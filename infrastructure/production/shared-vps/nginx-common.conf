# Shared by the api.galylio.com and admin.galylio.com servers.
# Only Apache on the host may supply a client address. The Docker port is loopback-only.
set_real_ip_from 172.29.90.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
location = /nginx-health { access_log off; return 200 'ok'; }
client_header_timeout 10s;
send_timeout 30s;
limit_conn clients 64;
error_page 429 = @rate_limited;
location @rate_limited {
  default_type application/json;
  add_header Retry-After 2 always;
  add_header Cache-Control no-store always;
  add_header Strict-Transport-Security 'max-age=31536000' always;
  return 429 '{"code":"RATE_LIMITED","message":"Too many requests. Try again in a moment."}';
}
add_header Strict-Transport-Security 'max-age=31536000' always;
# JSON requests are small; only uploads may be large (see /v1/media below).
client_max_body_size 1m;
client_body_timeout 30s;
keepalive_timeout 30s;
# Sign-in, activation and password recovery have their own, stricter limit.
location ~* ^/v1/auth/(login|activate|forgot-password|reset-password)/?$ {
  limit_req zone=identity burst=10 nodelay;
  proxy_pass http://api;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
}
# Photos, documents and training videos stream straight to the API without buffering.
location /v1/media {
  limit_req zone=uploads burst=20 nodelay;
  limit_req zone=media_reads burst=240 nodelay;
  limit_conn upload_clients 8;
  client_max_body_size 90m;
  client_body_timeout 120s;
  proxy_request_buffering off;
  proxy_http_version 1.1;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_pass http://api;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
}
