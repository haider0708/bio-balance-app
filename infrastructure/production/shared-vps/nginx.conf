worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  log_format redacted '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log redacted;
  error_log /var/log/nginx/error.log warn;
  limit_req_zone $binary_remote_addr zone=identity:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_requests:10m rate=50r/s;
  limit_conn_zone $binary_remote_addr zone=clients:10m;
  limit_req_status 429;
  limit_conn_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api {
    zone api 64k;
    least_conn;
    server api1:3000 resolve;
    server api2:3000 resolve;
    keepalive 32;
  }
  server {
    listen 80;
    server_name api.galylio.com;
    # Only Apache on the host may supply a client address. The Docker port is loopback-only.
    set_real_ip_from 172.29.90.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    location = /nginx-health { access_log off; return 200 'ok'; }
    client_header_timeout 10s;
    send_timeout 30s;
    limit_conn clients 64;
    error_page 429 = @rate_limited;
    location @rate_limited {
      default_type application/json;
      add_header Retry-After 2 always;
      add_header Cache-Control no-store always;
      add_header Strict-Transport-Security 'max-age=31536000' always;
      return 429 '{"code":"RATE_LIMITED","message":"Trop de requêtes. Réessayez dans quelques instants."}';
    }
    add_header Strict-Transport-Security 'max-age=31536000' always;
    client_max_body_size 5m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    location /_media/ {
      internal;
      add_header Cache-Control no-store always;
      alias /var/lib/biobalance/media/;
      add_header X-Content-SHA256 $upstream_http_x_content_sha256 always;
      add_header X-Correlation-Id $upstream_http_x_correlation_id always;
      add_header Strict-Transport-Security 'max-age=31536000' always;
    }
    # Logout uses the general flood limit, independently of login/recovery limits.
    location ~* ^/v1/identity/logout/?$ {
      limit_req zone=api_requests burst=100 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
    location ~* ^/v1/identity/ {
      limit_req zone=identity burst=10 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
    location ~* ^/v1/media/uploads(?:/|$) {
      limit_req zone=uploads burst=20 nodelay;
      limit_conn clients 8;
      proxy_request_buffering off;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / {
      limit_req zone=api_requests burst=100 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 60s;
      proxy_pass http://api;
    }
  }
}
