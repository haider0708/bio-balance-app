worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  log_format redacted '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log redacted;
  error_log /var/log/nginx/error.log warn;
  limit_req_zone $binary_remote_addr zone=identity:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_requests:10m rate=50r/s;
  limit_conn_zone $binary_remote_addr zone=clients:10m;
  limit_req_status 429;
  limit_conn_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api {
    zone api 64k;
    least_conn;
    server api1:3000 resolve;
    server api2:3000 resolve;
    keepalive 32;
    # Retire pooled connections before Node closes them at five seconds.
    keepalive_timeout 4s;
  }
  # The API (the phone apps) and a link from the old admin address to the new one.
  server {
    listen 80;
    server_name api.galylio.com;
    include /etc/nginx/biobalance-common.conf;
    location = /admin { return 301 https://admin.galylio.com/; }
    location /admin/ { return 301 https://admin.galylio.com/; }
    location / {
      include /etc/nginx/biobalance-api-proxy.conf;
    }
  }
  # The admin web page: the same app as on the phone, built by scripts/deploy-web.sh and mounted read-only.
  # The page and the API answer on this one address, so the browser needs no cross-site permission.
  server {
    listen 80;
    server_name admin.galylio.com;
    include /etc/nginx/biobalance-common.conf;
    location /v1/ {
      include /etc/nginx/biobalance-api-proxy.conf;
    }
    # Any address without a file extension is a page of the app; a missing file is a real 404.
    location @app {
      if ($uri ~ \.[A-Za-z0-9]+$) { return 404; }
      rewrite ^ /index.html last;
    }
    location / {
      root /usr/share/biobalance-web;
      try_files $uri $uri/ @app;
      gzip on;
      gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;
      gzip_min_length 1024;
      gzip_comp_level 5;
      gzip_vary on;
      limit_req zone=api_requests burst=100 nodelay;
      # Files keep the same names between versions, so the browser re-checks them every time (a cheap 304 when unchanged).
      # "private" stops Cloudflare from replacing this with its own four-hour browser cache.
      add_header Cache-Control 'private, no-cache' always;
      add_header Strict-Transport-Security 'max-age=31536000' always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://fonts.gstatic.com blob: data:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
  }
}
