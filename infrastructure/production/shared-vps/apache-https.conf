<VirtualHost *:443>
    ServerName api.galylio.com
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/api.galylio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.galylio.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLSessionTickets Off
    Include /opt/biobalance/infrastructure/production/shared-vps/cloudflare-origin.conf
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders Off
    # Replace all client-supplied forwarding headers at the public boundary.
    RequestHeader unset Forwarded
    RequestHeader unset X-Real-IP
    RequestHeader set X-Forwarded-For "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 65
    LimitRequestBody 5242880
    SetEnv no-gzip 1
    ProxyPass / http://127.0.0.1:18081/ connectiontimeout=5 timeout=65
    ProxyPassReverse / http://127.0.0.1:18081/
    ErrorLog ${APACHE_LOG_DIR}/biobalance-error.log
    CustomLog ${APACHE_LOG_DIR}/biobalance-access.log "%a %m %U %>s %D"
</VirtualHost>
