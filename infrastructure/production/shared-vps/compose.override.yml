# go2code: Apache owns public 80/443. Nginx is reachable only from this host.
services:
  nginx:
    ports: !override ['127.0.0.1:18081:80']
    volumes: !override
      - ./shared-vps/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/biobalance-web:/usr/share/biobalance-web/admin:ro
    mem_limit: 128m
    cpus: 1
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    tmpfs: [/var/cache/nginx:size=64m, /var/run:size=8m, /tmp:size=16m]
  api1:
    mem_limit: 512m
    cpus: 1.5
    environment:
      NODE_OPTIONS: --max-old-space-size=384
  api2:
    mem_limit: 512m
    cpus: 1.5
    environment:
      NODE_OPTIONS: --max-old-space-size=384
  worker:
    mem_limit: 384m
    cpus: 0.5
    environment:
      NODE_OPTIONS: --max-old-space-size=256
  postgres:
    mem_limit: 2g
    cpus: 4
    shm_size: 256m
    command: [postgres,-c,shared_buffers=256MB,-c,work_mem=4MB,-c,max_connections=60,-c,log_min_duration_statement=500,-c,max_wal_size=512MB]
networks:
  private:
    ipam:
      config:
        - subnet: 172.29.90.0/24
          gateway: 172.29.90.1
