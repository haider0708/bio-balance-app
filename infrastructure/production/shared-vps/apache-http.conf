<VirtualHost *:80>
    ServerName api.galylio.com
    DocumentRoot /var/www/biobalance-acme
    Alias /.well-known/acme-challenge/ /var/www/biobalance-acme/.well-known/acme-challenge/
    <Directory /var/www/biobalance-acme/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://api.galylio.com%{REQUEST_URI} [R=301,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/biobalance-error.log
    CustomLog ${APACHE_LOG_DIR}/biobalance-access.log "%a %m %U %>s %D"
</VirtualHost>
