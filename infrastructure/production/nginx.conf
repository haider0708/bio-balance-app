worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  log_format redacted '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log redacted;
  error_log /var/log/nginx/error.log warn;
  limit_req_zone $binary_remote_addr zone=identity:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=clients:10m;
  limit_req_status 429;
  limit_conn_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api {
    zone api 64k;
    least_conn;
    server api1:3000 resolve;
    server api2:3000 resolve;
    keepalive 32;
  }
  server {
    listen 80;
    server_name _;
    location = /nginx-health { access_log off; return 200 'ok'; }
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certificates/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificates/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    client_max_body_size 5m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    location /_media/ {
      internal;
      alias /var/lib/biobalance/media/;
      add_header X-Content-SHA256 $upstream_http_x_content_sha256 always;
      add_header X-Correlation-Id $upstream_http_x_correlation_id always;
      add_header Strict-Transport-Security 'max-age=31536000' always;
    }
    location /v1/identity/ {
      limit_req zone=identity burst=10 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v1/media/uploads {
      limit_req zone=uploads burst=20 nodelay;
      limit_conn clients 8;
      proxy_request_buffering off;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_pass http://api;
    }
  }
}
