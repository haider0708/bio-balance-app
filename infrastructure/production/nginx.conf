worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  log_format redacted '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log redacted;
  error_log /var/log/nginx/error.log warn;
  limit_req_zone $binary_remote_addr zone=identity:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=api_requests:10m rate=50r/s;
  limit_conn_zone $binary_remote_addr zone=clients:10m;
  limit_req_status 429;
  limit_conn_status 429;
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api {
    zone api 64k;
    least_conn;
    server api1:3000 resolve;
    server api2:3000 resolve;
    keepalive 32;
    # Retire pooled connections before Node closes them at five seconds.
    keepalive_timeout 4s;
  }
  server {
    listen 80;
    server_name _;
    location = /nginx-health { access_log off; return 200 'ok'; }
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certificates/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificates/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_tickets off;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_conn clients 64;
    error_page 429 = @rate_limited;
    location @rate_limited {
      default_type application/json;
      add_header Retry-After 2 always;
      add_header Cache-Control no-store always;
      add_header Strict-Transport-Security 'max-age=31536000' always;
      return 429 '{"code":"RATE_LIMITED","message":"Too many requests. Try again in a moment."}';
    }
    add_header Strict-Transport-Security 'max-age=31536000' always;
    # JSON requests are small; only uploads may be large (see /v1/media below).
    client_max_body_size 1m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    # Sign-in, activation and password recovery have their own, stricter limit.
    location ~* ^/v1/auth/(login|activate|forgot-password|reset-password)/?$ {
      limit_req zone=identity burst=10 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Photos, documents and training videos stream straight to the API without buffering.
    location /v1/media {
      limit_req zone=uploads burst=20 nodelay;
      limit_conn clients 8;
      client_max_body_size 90m;
      client_body_timeout 120s;
      proxy_request_buffering off;
      proxy_http_version 1.1;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # The admin web page: the same app as on the phone, built by scripts/deploy-web.sh and mounted read-only.
    location = /admin { return 301 /admin/; }
    location /admin/ {
      root /usr/share/biobalance-web;
      try_files $uri $uri/ /admin/index.html;
      gzip on;
      gzip_types text/css application/javascript application/json application/wasm image/svg+xml text/plain;
      gzip_min_length 1024;
      gzip_comp_level 5;
      gzip_vary on;
      limit_req zone=api_requests burst=100 nodelay;
      # Files keep the same names between versions, so the browser re-checks them every time (a cheap 304 when unchanged).
      add_header Cache-Control 'private, no-cache' always;
      add_header Strict-Transport-Security 'max-age=31536000' always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.galylio.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.galylio.com https://fonts.gstatic.com blob: data:; media-src 'self' blob: https://api.galylio.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
    location / {
      limit_req zone=api_requests burst=100 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_pass http://api;
    }
  }
}
