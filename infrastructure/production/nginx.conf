worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  log_format redacted '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log redacted;
  error_log /var/log/nginx/error.log warn;
  limit_req_zone $binary_remote_addr zone=identity:10m rate=10r/m;
  upstream api { least_conn; server api1:3000; server api2:3000; keepalive 32; }
  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/certificates/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificates/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    client_max_body_size 5m;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    location /_media/ {
      internal;
      alias /var/lib/biobalance/media/;
      add_header Cache-Control "private, max-age=3600";
    }
    location /v1/identity/login {
      limit_req zone=identity burst=10 nodelay;
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      proxy_pass http://api;
    }
  }
}
