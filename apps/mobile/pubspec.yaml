name: biobalance
description: "BioBalance: stock, sales and rewards for the BioBalance partner network."
publish_to: 'none'
version: 3.1.0+36

environment:
  sdk: ^3.13.4

dependencies:
  collection: ^1.19.1
  dio: ^5.11.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.1.0
  flutter_riverpod: ^3.0.0
  flutter_secure_storage: ^11.2.0
  go_router: ^17.0.0
  image_picker: ^1.2.0
  intl: any
  lucide_icons_flutter: ^3.1.20
  mobile_scanner: ^7.4.2
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  web: ^1.1.0
  uuid: ^4.6.0
  video_player: ^2.14.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^19.0.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  crypto: ^3.0.7
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/licenses/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
