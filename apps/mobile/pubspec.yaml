name: biobalance
description: "BioBalance : magasins, stocks, ventes et récompenses."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  app_links: ^7.2.1
  crypto: ^3.0.7
  csv: ^8.0.0
  dio: ^5.11.1
  drift: ^2.35.0
  file_picker: ^13.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  html: ^0.15.7
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: 6.9.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
